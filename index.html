<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#CDEEBB">
<meta name="robots" content="noindex, nofollow">
<title>Gesundheits-Lexikon</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lexikon">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script>try{var t=localStorage.getItem("lex_theme");if(t==="dark"||t==="black"){document.documentElement.setAttribute("data-theme","black");document.querySelector('meta[name="theme-color"]').setAttribute("content","#000000");}}catch(_){}</script>
<style>
:root{--bg:#F5FBF1;--head:#CDEEBB;--soft:#EAF7E2;--soft2:#E6F6DC;--soft3:#EEF9E7;--line:#DCEFD2;--pri:#2E7D32;--btn:#9BE07A;--card:#fff;--glass:rgba(255,255,255,.72);--tint:#F4FBF0;--line2:#C9E6BB;--ink3:#24502E;--onbtn:#123A1B;--accent:#3B7A47;--onpri2:#D7F2C8;
 --ink:#143D1E;--ink2:#173B22;--body:#24402B;--muted:#4E6B55;--muted2:#3D5C45;--warn-bg:#FFF8E1;--warn:#5D4A0B;--red:#E53935;--fs:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink2);font-family:Manrope,"Segoe UI",Roboto,system-ui,-apple-system,sans-serif}
body{font-size:calc(15px*var(--fs));line-height:1.45;padding-bottom:100px}
body.noscroll{overflow:hidden}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--pri)}
.wrap{max-width:720px;margin:0 auto}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.head{background:var(--head);padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;flex-direction:column;gap:12px;position:sticky;top:0;z-index:6;transition:border-radius .15s,box-shadow .15s}
.head.solo{padding-bottom:16px;border-radius:0 0 26px 26px}
.head.stuck{border-radius:0 0 22px 22px;box-shadow:0 6px 18px rgba(20,61,30,.20)}
.areabar{background:var(--head);padding:0 16px 16px;border-radius:0 0 26px 26px;margin-top:-1px}
.toprow{display:flex;align-items:center;gap:8px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;border:none;background:none;padding:0;text-align:left}
.logo{width:40px;height:40px;border-radius:12px;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--pri);flex:none}
.logo .lg{width:30px;height:30px;margin-top:2px}
.appbox{display:flex;align-items:center;gap:12px;padding:14px}
.offbox{display:flex;flex-direction:column;gap:10px;padding:14px}
.offhead{display:flex;align-items:center;gap:12px}.offhead b{font-weight:800;color:var(--ink);font-size:calc(15px*var(--fs))}
.offbar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}.offbar i{display:block;height:100%;background:var(--pri);transition:width .25s}
.appbox .logo{background:var(--soft3)}
.brand b{font-size:calc(19px*var(--fs));font-weight:800;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;border-radius:14px;border:none;background:var(--card);display:flex;align-items:center;justify-content:center;color:var(--pri);flex:none}
.iconbtn.round{border-radius:22px}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 6px 0 14px;height:50px;color:var(--muted)}
.search input{flex:1;border:none;outline:none;background:transparent;min-width:0;color:var(--ink2)}
.search input::-webkit-search-cancel-button{display:none;-webkit-appearance:none}
.sbox{position:relative}
.qgo{border:none;background:none;padding:0;width:32px;height:40px;margin-left:-6px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.sug{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--card);border-radius:16px;box-shadow:0 10px 28px rgba(20,61,30,.22);overflow:hidden;z-index:9}
.sug button{display:flex;align-items:center;gap:12px;width:100%;min-height:50px;border:none;border-top:1px solid var(--line);background:var(--card);padding:0 16px;text-align:left;font-size:calc(15px*var(--fs));color:var(--ink);font-weight:600}
.sug button:first-child{border-top:none}
.sug button svg{width:18px;height:18px;color:var(--muted);flex:none}
.sug button b{font-weight:800}
.sug button small{margin-left:auto;color:var(--muted);font-size:12px;font-weight:700}
.totop{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));width:50px;height:50px;border-radius:25px;border:none;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;z-index:7;box-shadow:0 6px 18px rgba(20,61,30,.30);opacity:0;transform:translateY(12px) scale(.9);pointer-events:none;transition:opacity .2s,transform .2s}
.totop.show{opacity:1;transform:none;pointer-events:auto}
.totop svg{transform:rotate(90deg)}
body.detailpg .totop{bottom:calc(100px + env(safe-area-inset-bottom))}
.seg button.ti{display:flex;align-items:center;gap:4px;padding:0 12px}
.seg button.ti svg{width:19px;height:19px}
.search .clear{border:none;background:none;color:var(--muted);width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center}
.areas{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.areas button{min-height:52px;border:none;border-radius:15px;background:var(--glass);color:var(--ink3);font-weight:700;font-size:calc(12px*var(--fs));line-height:1.2;padding:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.areas .sym{font-size:14px;line-height:1;color:var(--pri)}
.areas button.on{background:var(--pri);color:#fff;font-weight:800}
.areas button.on .sym{color:#fff}

.note{margin:14px 16px 0;background:var(--warn-bg);border-radius:14px;padding:10px 12px;font-size:calc(12px*var(--fs));line-height:1.45;color:var(--warn)}
.chipbar{display:flex;align-items:center;gap:0;padding:12px 0 2px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-right:8px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:38px;padding:0 13px;border-radius:19px;border:1px solid var(--line2);background:var(--card);color:var(--ink3);font-weight:600;font-size:calc(13px*var(--fs));display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip small{font-weight:700;color:var(--muted);font-size:11px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.chip.on small{color:var(--onpri2)}
.morebtn{flex:none;width:46px;height:38px;margin-right:12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--pri);display:flex;align-items:center;justify-content:center;box-shadow:-10px 0 12px var(--bg)}
.filters{display:flex;gap:8px;padding:8px 16px 0;align-items:center;flex-wrap:wrap}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:none;background:transparent;height:34px;padding:0 11px;border-radius:9px;font-size:calc(12.5px*var(--fs));font-weight:600;color:var(--muted2);white-space:nowrap;flex:none}
.seg button.on{background:var(--card);color:var(--ink);font-weight:800;box-shadow:0 2px 6px rgba(30,80,40,.12)}
.seg button small{font-weight:700;color:var(--muted);font-size:10.5px;margin-left:3px}
.sortbtn{margin-left:auto;border:none;background:none;color:var(--muted);font-weight:700;font-size:calc(12px*var(--fs));display:flex;align-items:center;gap:4px;height:34px}
select.sel{height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--card);padding:0 10px;font-weight:600;color:var(--ink2);width:100%;max-width:100%}

.sec{padding:16px 16px 0;display:flex;flex-direction:column;gap:10px}
.sec h3{margin:0;font-size:calc(13px*var(--fs));font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);display:flex;align-items:center;gap:8px}
.sec h3 .lnk{margin-left:auto;text-transform:none;letter-spacing:0;font-weight:700;color:var(--pri);border:none;background:none;font-size:13px;padding:6px 0}
.feat{background:var(--card);border-radius:22px;overflow:hidden;box-shadow:0 6px 20px rgba(30,80,40,.10)}
.feat .img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--soft)}
.feat .txt{padding:12px 14px 14px;display:flex;flex-direction:column;gap:5px}
.card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:10px;box-shadow:0 3px 12px rgba(30,80,40,.07)}
.card .main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:none;background:none;padding:0;text-align:left}
.thumb{position:relative;flex:none;width:84px;height:84px;border-radius:14px;overflow:hidden;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--pri)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.play{position:absolute;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border-radius:14px;background:rgba(255,255,255,.92);display:flex;align-items:center;justify-content:center}
.play svg{width:12px;height:12px;fill:var(--pri);stroke:none}
.dur{position:absolute;right:4px;bottom:4px;background:rgba(20,61,30,.85);color:#fff;font-size:10px;font-weight:700;padding:1px 5px;border-radius:5px}
.cardtxt{display:flex;flex-direction:column;gap:3px;min-width:0}
.meta{font-size:calc(11px*var(--fs));font-weight:700;color:var(--pri);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{font-size:calc(15px*var(--fs));font-weight:800;line-height:1.25;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.sub{font-size:calc(12px*var(--fs));font-weight:600;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.thumblink{flex:none;display:block;border-radius:14px}
.sharebtn{width:44px;height:44px;border-radius:14px;border:none;background:var(--soft);display:flex;align-items:center;justify-content:center;color:var(--ink3);flex:none}
.more{margin:14px 16px 0;height:50px;border-radius:16px;border:1px solid var(--line2);background:var(--card);color:var(--ink3);font-weight:700;width:calc(100% - 32px)}
.empty{background:var(--card);border-radius:18px;padding:18px;color:var(--muted2)}
.hit{font-size:calc(12.5px*var(--fs));color:var(--muted2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
mark{background:#FFE58A;color:inherit;border-radius:3px;padding:0 1px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:none;background:var(--card);border-radius:18px;overflow:hidden;padding:0;text-align:left;box-shadow:0 3px 12px rgba(30,80,40,.07)}
.tile img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--soft)}
.tile span{display:block;padding:8px 10px 2px;font-weight:800;font-size:calc(14px*var(--fs));color:var(--ink);line-height:1.25}
.tile small{display:block;padding:0 10px 10px;color:var(--muted);font-weight:600;font-size:12px}
.htile{border:none;background:var(--card);border-radius:18px;padding:14px;text-align:left;box-shadow:0 3px 12px rgba(30,80,40,.07);display:flex;flex-direction:column;gap:4px}
.htile b{font-size:calc(15px*var(--fs));color:var(--ink);line-height:1.25}
.htile span{font-size:calc(12.5px*var(--fs));color:var(--muted2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.gal button{border:none;padding:0;background:var(--soft);border-radius:12px;overflow:hidden;aspect-ratio:3/4}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.strip{display:flex;gap:8px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.strip button{flex:none;width:110px;height:146px;border:none;padding:0;border-radius:12px;overflow:hidden;background:var(--soft)}
.strip img{width:100%;height:100%;object-fit:cover;display:block}

/* Sofort-Hilfe */
.hhero{background:var(--head);padding:12px 16px 20px;border-radius:0 0 26px 26px;display:flex;flex-direction:column;gap:10px}
.hhero .row{display:flex;align-items:center;gap:8px}
.hhero h1{margin:0;font-size:calc(26px*var(--fs));line-height:1.15;font-weight:800;color:var(--ink)}
.hhero p{margin:0;color:var(--body);line-height:1.5}
.hcard{background:var(--card);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:9px;box-shadow:0 3px 12px rgba(30,80,40,.07)}
.hcard h2{margin:0;font-size:calc(17px*var(--fs));font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.li{display:flex;gap:10px;align-items:flex-start;line-height:1.45;color:var(--body)}
.li .mk{flex:none;width:24px;height:24px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-top:0}
.li .mk svg{width:14px;height:14px;stroke-width:3}
.mk.ok{background:#D6F2C6;color:#1E6B2A}.mk.no{background:#FDE1E0;color:#C62828}.mk.warn{background:#FFE8B3;color:#8A5A00}.mk.dot{background:var(--soft);color:var(--pri)}
.hcard.arzt{background:#FFF5E5;border:1px solid #F5D7A1}
.hcard.arzt h2{color:#7A4B00}
.small{font-size:calc(12px*var(--fs));color:var(--muted);line-height:1.45}
details.acc{background:var(--card);border-radius:18px;box-shadow:0 3px 12px rgba(30,80,40,.07);overflow:hidden}
details.acc summary{list-style:none;padding:14px 16px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:10px;cursor:pointer}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary .chev{margin-left:auto;transition:transform .2s}
details.acc[open] summary .chev{transform:rotate(180deg)}
details.acc .in{padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;color:var(--body);line-height:1.55}
.lvl{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:6px 2px -2px}
.gbtn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:16px;background:var(--card);border:1px solid var(--line2);color:var(--ink);font-weight:800;text-decoration:none}
.hsum{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 6px 18px rgba(30,80,40,.10);border:2px solid var(--head)}
.hsum .top{background:var(--head);padding:10px 14px;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--ink)}
.hsum .in{padding:12px 14px;display:flex;flex-direction:column;gap:7px}

/* Detail */
.detail{background:var(--card);min-height:100vh}
.hero{position:relative;background:var(--soft)}
.hero img{display:block;width:100%;max-height:60vh;object-fit:cover}
.hero .noimg{height:110px}
.hero .back,.hero .shr,.hero .fav{position:absolute;top:12px;width:44px;height:44px;border-radius:22px;border:none;background:rgba(255,255,255,.94);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.hero .back{left:12px}.hero .shr{right:12px}.hero .fav{right:64px}
.fav.on,.vbtn.on{color:var(--red)}
.hero .bigplay{position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:32px;background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.hero .bigdur{position:absolute;left:14px;bottom:34px;background:rgba(255,255,255,.95);color:#143D1E;font-weight:800;font-size:14px;padding:6px 12px;border-radius:999px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hero .bigplay svg{width:26px;height:26px;fill:var(--pri);stroke:none}
.body{margin-top:-20px;position:relative;background:var(--card);border-radius:24px 24px 0 0;padding:20px 16px 110px;display:flex;flex-direction:column;gap:16px}
.body h1{margin:0;font-size:calc(22px*var(--fs));line-height:1.25;font-weight:800;color:var(--ink)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:calc(12px*var(--fs));font-weight:600;color:var(--ink3);background:var(--soft2);padding:6px 10px;border-radius:10px;border:none}
.box{background:var(--soft3);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.box b{font-size:calc(13px*var(--fs));color:var(--accent)}
.box p{margin:0;line-height:1.55;color:var(--body);white-space:pre-line}
.facts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fact{background:var(--tint);border-radius:14px;padding:10px 12px}
.fact small{display:block;font-size:11px;font-weight:700;color:var(--muted)}
.fact span{display:block;font-weight:700;color:var(--ink);font-size:calc(14px*var(--fs));overflow:hidden;text-overflow:ellipsis}
.h2{margin:0;font-size:calc(17px*var(--fs));font-weight:800;color:var(--ink)}
.chap{display:flex;gap:12px;align-items:flex-start;padding:9px 12px;border-radius:14px;background:var(--tint);text-decoration:none;color:var(--body)}
.chap .tm,.trrow .tm{flex:none;font-size:12.5px;font-weight:800}
.chap .tm{min-width:52px;text-align:center;color:#fff;background:var(--pri);border-radius:8px;padding:3px 6px}
.trbox{border:1px solid var(--line);border-radius:16px;overflow:hidden}
.trbox .tsearch{display:flex;align-items:center;gap:8px;padding:0 12px;height:46px;border-bottom:1px solid var(--line);color:var(--muted)}
.trbox .tsearch input{flex:1;border:none;outline:none;min-width:0;background:transparent}
.trlist{max-height:420px;overflow-y:auto;padding:8px 12px;display:flex;flex-direction:column;gap:6px}
.trrow{display:flex;gap:10px;align-items:baseline;text-decoration:none;color:var(--muted2)}
.trrow .tm{color:var(--pri);width:44px}
.linkrow{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:16px;padding:10px 10px 10px 14px}
.linkrow a{flex:1;min-width:0;text-decoration:none;display:flex;flex-direction:column;gap:2px}
.linkrow a small{font-size:11px;font-weight:700;color:var(--pri)}
.linkrow a span{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcopy{flex:1;min-width:0;border:none;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit}
.lcopy small{font-size:11px;font-weight:700;color:var(--pri);display:flex;align-items:center;gap:5px}
.lcopy small .i{width:14px;height:14px}
.lcopy span{font-weight:700;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcopy.ok small{color:var(--accent)}
.rel{display:flex;gap:10px;overflow-x:auto;margin:0 -16px;padding:0 16px 4px}
.rel button{flex:none;width:150px;border:none;background:var(--tint);border-radius:16px;padding:0;overflow:hidden;text-align:left}
.rel img,.rel .ph{display:block;width:150px;height:86px;object-fit:cover;background:var(--soft)}
.rel span{padding:7px 10px 10px;font-size:13px;font-weight:700;line-height:1.3;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(14px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;z-index:5;max-width:720px;margin:0 auto}
.big{height:54px;border-radius:18px;border:none;background:var(--btn);color:var(--onbtn);font-size:calc(15px*var(--fs));font-weight:800;display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none}
.big.light{background:var(--soft);color:var(--ink)}

.nav{position:fixed;left:0;right:0;bottom:0;max-width:720px;margin:0 auto;height:calc(66px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);box-sizing:border-box;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(30,80,40,.16);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));align-items:center;z-index:5}

/* ---------- Suchvorschläge (max. 3, mit Tippfehler-Korrektur) ---------- */
let VOC = null, QTMO;
function buildVoc(){
  const m = new Map();
  const add = (txt, w) => { for (const raw of String(txt||"").split(/[^0-9A-Za-zÀ-ɏЀ-ӿß-]+/)) {
      const t = raw.replace(/^-+|-+$/g, ""); if (t.length < 4 || /\d/.test(t)) continue;
      const k = norm(t), o = m.get(k);
      if (o) { o.n += w; o.f[t] = (o.f[t]||0) + w; } else m.set(k, {k, n:w, f:{[t]:w}}); } };
  E.forEach(e => { add(e.ti, 3); (e.tg||[]).forEach(t => add(t, 2)); add(e.d, 1); });
  H.forEach(h => { add(h.ti, 8); (h.sy||[]).forEach(x => add(x, 6)); });
  D.cats.forEach(c => add(catName(c.id), 4));
  const shout = w => w.length > 1 && w === w.toUpperCase();
  VOC = [...m.values()].filter(o => o.n >= 2).map(o => ({k:o.k, n:o.n,
    w: Object.entries(o.f).sort((a,b) => (shout(a[0])-shout(b[0])) || b[1]-a[1])[0][0]}))
    .map(o => shout(o.w) ? {...o, w: o.w[0] + o.w.slice(1).toLowerCase()} : o);
}
function dist(a, b, max){
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let p2 = null, p = Array.from({length:b.length+1}, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const c = [i]; let lo = i;
    for (let j = 1; j <= b.length; j++) {
      let v = Math.min(p[j] + 1, c[j-1] + 1, p[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
      if (p2 && i > 1 && j > 1 && a[i-1] === b[j-2] && a[i-2] === b[j-1]) v = Math.min(v, p2[j-2] + 1);
      c[j] = v; if (v < lo) lo = v;
    }
    if (lo > max) return max + 1; p2 = p; p = c;
  }
  return p[b.length];
}
function suggest(tokRaw){
  const tok = norm(tokRaw); if (tok.length < 2) return [];
  if (!VOC) buildVoc();
  const max = tok.length <= 6 ? 1 : 2, res = [];
  for (const o of VOC) {
    let sc;
    if (o.k.startsWith(tok)) sc = o.k === tok ? 0 : 1;
    else {
      if (tok.length < 3) continue;
      let d = dist(tok, o.k, max);
      if (tok.length >= 4 && o.k.length > tok.length) { for (const L of [tok.length - 1, tok.length, tok.length + 1]) { if (L >= o.k.length) continue; const dp = dist(tok, o.k.slice(0, L), 1); if (dp <= 1) d = Math.min(d, dp); } }
      if (d > max) continue; sc = 2 + d;
    }
    res.push({w:o.w, sc, n:o.n});
  }
  res.sort((a,b) => a.sc - b.sc || b.n - a.n);
  const key = w => norm(w).replace(/-/g, ""), seen = [], out = [];
  const nah = (a, b) => Math.abs(a.length - b.length) <= 2 && (a.startsWith(b) || b.startsWith(a));
  for (const x of res) { const k = key(x.w); if (seen.some(y => y === k || nah(y, k))) continue; seen.push(k); out.push(x.w); if (out.length === 3) break; }
  return out;
}

  const ch = document.getElementById("chan"); if (ch) ch.onchange = () => { S.chan = ch.value; S.limit = 40; render(true); };
}
document.addEventListener("click", ev => {
  const t = ev.target.closest("button,a,[data-viewer]"); if (!t) return;
  const d = t.dataset;
  if (VW) {
    if (d.vimmx!==undefined) return setImm(false);
    if (d.vclose!==undefined) return closeViewer();
    const e = VW.list[VW.idx];
    if (d.vshare!==undefined) return shareImage(e);
    if (d.vfav!==undefined) { toggleFav(e.id); return vUpdate(); }
    if (d.vinfo!==undefined) { const id=e.id; closeViewer(true); history.replaceState(null, "", "#e/"+id); render(); return; }
    return;
  }
  if (d.themeSet) { setTheme(d.themeSet); render(true); return; }
  if (d.offline !== undefined) { offlineDownload(); return; }
  if (d.install !== undefined && INSTALL) { INSTALL.prompt(); INSTALL.userChoice.finally(() => { INSTALL = null; render(true); }); return; }
  if (d.copylex !== undefined) { copyText(lexLink()).then(() => { toast("Link kopiert");
    const h = document.getElementById("copyhint"); if (h) { t.classList.add("ok"); h.innerHTML = ico("check") + "In die Zwischenablage kopiert";
      setTimeout(() => { if (document.body.contains(t)) { t.classList.remove("ok"); h.innerHTML = ico("copy") + "Antippen zum Kopieren"; } }, 2500); } }); return; }
  if (d.sharelex !== undefined) { const url = lexLink();
    if (navigator.share) navigator.share({title:"Gesundheits-Lexikon", text:"Gesundheits-Lexikon – Wissen aus unseren Gruppen: Soforthilfe, Videos, Artikel und Infografiken", url}).catch(() => {});
    else copyText(url).then(() => toast("Link kopiert")); return; }
  if (d.sug !== undefined) { ev.preventDefault(); return runSearch(d.sug); }
  if (t.id === "qgo") { ev.preventDefault(); const q = document.getElementById("q"); if (!q.value.trim()) { q.focus(); return; } return runSearch(q.value); }
  if (d.viewer) { ev.preventDefault(); return openViewer(d.viewer, d.ctx); }
  if (d.open) { const e = BY.get(d.open); scrollMem[route()] = window.scrollY; if (e && e.t==="image") return openViewer(e.id, route()==="bilder"?"gal":""); location.hash = "e/" + d.open; return; }
  if (d.share) { ev.preventDefault(); return shareEntry(d.share); }
  if (d.sharehilfe) return shareHilfe(d.sharehilfe);
  if (d.catmenu!==undefined) return catMenu();
  if (d.go !== undefined) { document.getElementById("overlay").innerHTML=""; scrollMem[route()] = window.scrollY; if (d.go!=="#" && !d.go.startsWith("#h/")) S.q=""; if (d.go==="#" && S.q && !route()) { S.q=""; return render(); } location.hash = d.go; if ((d.go==="#"&&!route())||("#"+route())===d.go) window.scrollTo(0,0); return; }
  if (d.back !== undefined) { if (history.length > 1) history.back(); else location.hash = ""; return; }
  if (d.area) { S.area = d.area; S.cat = "all"; S.chan=""; S.limit = 40; ls.set("area", S.area); return render(true); }
  if (d.cat) { document.getElementById("overlay").innerHTML=""; S.cat = d.cat; S.limit = 40; render(true); const c=document.getElementById("chips"); if(c) c.scrollLeft=0; return; }
  if (d.typ) { S.typ = d.typ; S.limit = 40; return render(true); }
  if (d.sort !== undefined) { S.sort = S.sort==="new" ? "old" : "new"; return render(true); }
  if (d.more !== undefined) { S.limit += 40; return render(true); }
  if (d.topic) { const c = CAT.get(d.topic); if (c) { S.area = c.area; S.cat = c.id; S.typ="all"; S.q=""; S.limit=40; ls.set("area", S.area); } location.hash = ""; render(); window.scrollTo(0,0); return; }
  if (d.q) { S.q = d.q; S.cat = "all"; S.typ="all"; location.hash = ""; render(); window.scrollTo(0,0); return; }
  if (d.fav) { toggleFav(d.fav); return render(true); }
  if (d.view) { const [k,v] = d.view.split(":"); VIEW[k] = v; ls.set("views", VIEW); return render(true); }
  if (d.fcat) { S.fcat = d.fcat; return render(true); }
  if (d.ftyp) { S.ftyp = d.ftyp; return render(true); }
  if (d.fs) { S.fs = +d.fs; ls.set("fs", S.fs); document.documentElement.style.setProperty("--fs", S.fs); return render(true); }
  if (d.trall !== undefined) { t.textContent = "Transkripte werden geladen …"; t.disabled = true; loadScript("tsuche.js", () => { const b=document.getElementById("trhits"); if (b) b.innerHTML = window.LEX_TI ? trHitsHtml(terms(S.q)) : `<div class="empty">Die Transkripte sind nur in der gespeicherten Offline-Version enthalten.</div>`; }); return; }
  if (t.id === "qclear") { S.q = ""; return render(true); }
});
function toggleFav(id){ S.fav.has(id) ? S.fav.delete(id) : S.fav.add(id); ls.set("saved", [...S.fav]); if (S.fav.has(id)) offlineMerken([id]); }
/* Favoriten-Bilder für offline vorladen (der Service Worker speichert sie) */
function offlineMerken(ids){ ids.forEach(id => { const e = BY.get(id); if (!e) return; [e.im, e.t==="image" ? e.big : null].filter(Boolean).forEach(u => fetch(u).catch(()=>{})); }); }
document.addEventListener("change", ev => { if (ev.target.id === "lexurl") { S.lexUrl = ev.target.value.trim(); ls.set("lexUrl", S.lexUrl); toast("Gespeichert"); } });
window.addEventListener("hashchange", () => { if (!VW) document.getElementById("overlay").innerHTML = ""; render(); });
window.addEventListener("popstate", () => { if (!VW) return; if (VW.skipPop) { VW.skipPop = false; return; } if (VW.imm) setImm(false, true); else closeViewer(true); });
(function(){ let reload=false; try{ const n=performance.getEntriesByType("navigation")[0]; reload = n ? n.type==="reload" : performance.navigation.type===1; }catch(_){}
  const r = route(); if (r && (reload || !/^(e|h)\//.test(r))) history.replaceState(null, "", location.pathname + location.search); })();
render();

/* ---------- App (PWA): Offline-Speicher, Installation ---------- */
window.addEventListener("beforeinstallprompt", ev => { ev.preventDefault(); INSTALL = ev; if (route()==="einstellungen") render(true); });
window.addEventListener("appinstalled", () => { INSTALL = null; toast("Als App installiert"); });
window.addEventListener("offline", () => toast("Offline – gespeicherte Inhalte bleiben verfügbar"));
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then(() => navigator.serviceWorker.ready).then(() => {
      const fav = [...S.fav].filter(x => !x.startsWith("h:"));
      (window.requestIdleCallback || (f => setTimeout(f, 2000)))(() => offlineMerken(fav));
    }).catch(() => {});
  });
}
</script>
